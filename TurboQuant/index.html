/* ============ Design tokens ============ */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --code-bg: #eaedf1;
  --border: #dbe1e8;
  --border-strong: #c3cbd5;
  --text: #14181e;
  --text-muted: #545e6b;
  --text-faint: #8991a0;
  --accent: #0d8c86;
  --accent-ink: #ffffff;
  --channel-core: #0d8c86;
  --channel-core-soft: #e3f4f2;
  --channel-engine: #a85c14;
  --channel-engine-soft: #f7ecdf;
  --channel-ui: #7248b8;
  --channel-ui-soft: #efe7fa;
  --shadow: rgba(20, 30, 45, .10);
  --diagram-bg: #ffffff;
  --scrollbar: #c3cbd5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0e12;
    --surface: #12161c;
    --surface-2: #171c23;
    --code-bg: #1a2029;
    --border: #262d38;
    --border-strong: #333c49;
    --text: #e7ebf0;
    --text-muted: #9aa5b3;
    --text-faint: #6b7684;
    --accent: #35d6c7;
    --accent-ink: #06211f;
    --channel-core: #35d6c7;
    --channel-core-soft: #10302e;
    --channel-engine: #f0a94e;
    --channel-engine-soft: #33260f;
    --channel-ui: #b699f2;
    --channel-ui-soft: #281f3d;
    --shadow: rgba(0, 0, 0, .45);
    --diagram-bg: #12161c;
    --scrollbar: #333c49;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0e12;
  --surface: #12161c;
  --surface-2: #171c23;
  --code-bg: #1a2029;
  --border: #262d38;
  --border-strong: #333c49;
  --text: #e7ebf0;
  --text-muted: #9aa5b3;
  --text-faint: #6b7684;
  --accent: #35d6c7;
  --accent-ink: #06211f;
  --channel-core: #35d6c7;
  --channel-core-soft: #10302e;
  --channel-engine: #f0a94e;
  --channel-engine-soft: #33260f;
  --channel-ui: #b699f2;
  --channel-ui-soft: #281f3d;
  --shadow: rgba(0, 0, 0, .45);
  --diagram-bg: #12161c;
  --scrollbar: #333c49;
}

/* ============ Reset & base ============ */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--channel-core-soft); color: var(--text); }
* { scrollbar-color: var(--scrollbar) transparent; scrollbar-width: thin; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 5px; }
::-webkit-scrollbar-track { background: transparent; }

a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
a:hover { border-bottom-color: var(--accent); }
a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

code, .mono {
  font-family: 'JBMono', ui-monospace, "SF Mono", Consolas, monospace;
}
code {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: .1em .4em;
  font-size: .86em;
  color: var(--text);
  word-break: break-word;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ============ App shell ============ */
.app {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  min-height: 100vh;
}
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
}

/* ---- Sidebar ---- */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 20px 14px 32px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
@media (max-width: 860px) {
  .sidebar {
    position: fixed;
    inset: 0 20% 0 0;
    z-index: 40;
    transform: translateX(-100%);
    transition: transform .22s ease;
    box-shadow: 2px 0 24px var(--shadow);
  }
  .sidebar.open { transform: translateX(0); }
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 4px 10px 10px;
  border-bottom: 1px solid var(--border);
}
.brand-mark {
  font-family: 'JBMono', monospace;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .02em;
}
.brand-mark .dim { color: var(--text-faint); }
.brand-sub {
  font-size: 11.5px;
  color: var(--text-faint);
  letter-spacing: .04em;
  text-transform: uppercase;
}

.source-switch {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 9px;
}
.source-switch button {
  all: unset;
  flex: 1;
  box-sizing: border-box;
  text-align: center;
  cursor: pointer;
  font-family: 'JBMono', monospace;
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .03em;
  padding: 7px 8px;
  border-radius: 6px;
  color: var(--text-muted);
}
.source-switch button:hover { color: var(--text); }
.source-switch button[aria-pressed="true"] {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 2px var(--shadow);
}
.navset { display: none; flex-direction: column; }
.navset.active { display: flex; }

.navgroup { display: flex; flex-direction: column; }
.navgroup-btn {
  all: unset;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  border-radius: 7px;
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text);
}
.navgroup-btn:hover { background: var(--surface-2); }
.navgroup-btn[aria-current="page"] { background: var(--surface-2); }
.navgroup-btn .chan-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--dot, var(--text-faint));
  flex: none;
}
.navgroup-btn .count {
  margin-left: auto;
  font-family: 'JBMono', monospace;
  font-size: 10.5px;
  color: var(--text-faint);
  font-weight: 400;
}

.subnav {
  display: flex;
  flex-direction: column;
  margin: 2px 0 6px 25px;
  border-left: 1px solid var(--border);
  padding-left: 12px;
  gap: 1px;
}
.navgroup:not(.expanded) .subnav { display: none; }
.subnav a {
  border: none;
  padding: 5px 6px;
  border-radius: 5px;
  font-size: 12.5px;
  color: var(--text-muted);
  line-height: 1.35;
}
.subnav a:hover { color: var(--text); background: var(--surface-2); }
.subnav a.active { color: var(--dot, var(--accent)); font-weight: 600; }

.theme-toggle {
  all: unset;
  margin-top: auto;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-faint);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 10px;
}
.theme-toggle:hover { color: var(--text); border-color: var(--border-strong); }

/* ---- Topbar (mobile only) ---- */
.topbar {
  display: none;
  position: sticky;
  top: 0;
  z-index: 30;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
@media (max-width: 860px) { .topbar { display: flex; } }
.menu-btn {
  all: unset;
  cursor: pointer;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 6px;
  color: var(--text);
}
.menu-btn:hover { background: var(--surface-2); }
.scrim {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.35);
  z-index: 35;
}
.scrim.show { display: block; }

/* ---- Main content ---- */
main {
  position: relative;
  min-width: 0;
  padding: 48px clamp(20px, 5vw, 64px) 120px;
}
/* Inactive doc panels stay in normal DOM content (not display:none) so any
   diagram-rendering pass -- one-time on load or a live observer -- can
   always measure them; display:none can break SVG bounding-box measurement
   in hidden containers. position:absolute pulls them out of flow so they
   don't add blank space below the active panel. */
.doc { max-width: 760px; margin: 0 auto; width: calc(100% - 2 * clamp(20px, 5vw, 64px)); }
.doc:not(.active) { position: absolute; top: 0; left: clamp(20px, 5vw, 64px); visibility: hidden; }
.doc.active { position: static; visibility: visible; }

.doc-eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: 'JBMono', monospace;
  font-size: 12px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--chan, var(--text-faint));
  margin-bottom: 10px;
}
.doc-eyebrow .rule { width: 22px; height: 1px; background: currentColor; opacity: .5; }

h1 {
  font-family: 'JBMono', monospace;
  font-size: clamp(26px, 4vw, 34px);
  font-weight: 700;
  line-height: 1.18;
  letter-spacing: -.01em;
  text-wrap: balance;
  margin: 0 0 6px;
}
.doc-intro {
  color: var(--text-muted);
  font-size: 15px;
  margin: 14px 0 40px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);

<script type="text/markdown" id="doc-mermaid-readme"># Wiki: Архитектура TurboQuant (Mermaid)

Mermaid-версия документации из [wiki/Arch](../Arch/README.md). Не замена, а дополнение:
там — ASCII-диаграммы, читаемые в любом текстовом редакторе/терминале без рендеринга;
здесь — Mermaid, который рендерится на GitHub/GitLab и позволяет типы диаграмм, которые
в ASCII были бы нечитаемы: `classDiagram` для иерархий типов, `sequenceDiagram` для
порядка вызовов между компонентами, `stateDiagram-v2` для конечных автоматов
(слот сервера, MCP-подключение, DSV4 draft/verify).

| Документ | О чём | Новая глубина relative к wiki/Arch |
|---|---|---|
| [turboquant-core.md](./turboquant-core.md) | Core Domain — компрессия KV-кэша | classDiagram реестра типов; sequenceDiagram TriAttention; stateDiagram DSV4 MTP |
| [llama-cpp-fork.md](./llama-cpp-fork.md) | Форк llama.cpp/ggml целиком | 5-проходный алгоритм `ggml_backend_sched_split_graph()`; полная машина состояний слота сервера (`enum slot_state`) |
| [ui-frontend.md](./ui-frontend.md) | Чат-фронтенд tools/ui | Полная машина состояний MCP-подключения (`MCPConnectionPhase` + `HealthCheckStatus`, backoff-реконнект) |

## Сквозной сценарий: один decode-запрос через все три домена

Диаграмма — sequenceDiagram-эквивалент диаграммы потока данных из
[wiki/Arch/README.md](../Arch/README.md#поток-данных-между-доменами), но с явными
временными метками вызовов вместо статичных стрелок «①→⑥».

```mermaid
sequenceDiagram
    participant UI as "UI-Frontend<br/>Chat Domain"
    participant Server as "llama-cpp-fork<br/>Server domain"
    participant Orch as "llama-cpp-fork<br/>Inference Orchestration"
    participant KV as "llama-cpp-fork<br/>KV Cache Management"
    participant Codec as "turboquant-core<br/>Quantization Codec"
    participant Attn as "turboquant-core<br/>Attention Scoring"
    participant Samp as "llama-cpp-fork<br/>common/sampling.cpp"

    UI->>Server: POST /v1/chat/completions (SSE)
    Server->>Server: server_task → server-queue.cpp
    Server->>Orch: llama_decode(ctx, batch)
    Orch->>Orch: llama_batch_allocr →<br/>llama_ubatch, строит ggml_cgraph
    Orch->>KV: llama_kv_cache::find_slot()
    KV->>Codec: ggml_set_rows() — запись K/V

    Note over Codec: WHT → Lloyd-Max → (QJL)<br/>→ block_tbqX_Y (см. turboquant-core.md §2)
    Codec-->>KV: квантованный блок в кэше

    Orch->>Attn: узел flash-attention графа
    Attn->>Codec: dequant-free dot-product (K)
    Attn->>Codec: IWHT + combine (V)
    Note over Attn: + TriAttention eviction,<br/>если --triattention (см. §4)
    Codec-->>Attn: softmax·V
    Attn-->>Orch: логиты

    Orch->>Samp: логиты
    Samp-->>Server: следующий токен
    Server-->>UI: server_task_result_cmpl_partial (SSE chunk)

    Note over UI,Samp: цикл повторяется с "POST" до стоп-токена/лимита
```

**Ключевое наблюдение остаётся тем же, что и в ASCII-версии:** TurboQuant (`Codec`/`Attn`)
не отдельный узел на пути запроса, а точка врезки внутри KV Cache Management — сервер и
клиент о ней не знают. Здесь это видно ещё явнее: `Codec`/`Attn` вызываются только *изнутри*
вызовов `KV`/`Orch`, а не напрямую от `Server`/`UI`.

## Порядок чтения

Как и в ASCII-версии: `llama-cpp-fork.md` → `turboquant-core.md` → `ui-frontend.md`.
</script>
<script type="text/markdown" id="doc-mermaid-turboquant-core"># Архитектура (Mermaid): подсистема TurboQuant

> Версия [turboquant-core.md](../Arch/turboquant-core.md) в диаграммах Mermaid. Не дублирует
> ASCII-документ, а **копает глубже** там, где текстовые рамки не тянут: точная иерархия
> типов (classDiagram), временные диаграммы решений (sequenceDiagram), состояния
> draft/verify цикла (stateDiagram). Пути к файлам и номера строк — как в ASCII-версии.

## 1. Карта bounded context'ов

```mermaid
flowchart TB
    subgraph TQ["TurboQuant Subsystem (Core Domain)"]
        QC["Quantization Codec<br/>WHT + Lloyd-Max + QJL"]
        TR["Type Registry<br/>GGML_TYPE_TBQ*"]
        PP["Precision-Preservation<br/>outlier isolation"]
        AS["Attention Scoring<br/>flash-attn + TriAttention"]
        DV["Draft Verification<br/>DSV4 MTP"]
        QC -->|"регистрирует типы в"| TR
        PP <-->|"переиспользует блоки"| AS
        QC --> PP
        TR --> AS
        AS --> DV
    end
    CLI["Configuration/CLI Adapter<br/>Anti-Corruption Layer<br/>«tbq3» ↔ GGML enum"]
    TQ -->|"единственная видимая снаружи<br/>точка входа"| CLI
```

## 2. Домен: Quantization Codec — пайплайн квантизации

```mermaid
flowchart TD
    A["FP16/FP32 K или V вектор<br/>head_dim = 64/128/256/512/576"] --> B{"head_dim == 64?"}
    B -->|да| C["double-WHT (2 прохода)<br/>tbq_signs_64<br/>cpy-utils.cuh ~1708/1781/1849"]
    B -->|нет| D["одинарный WHT<br/>ggml-cuda/fwht.cu · fwht.cuh<br/>ggml_cuda_op_fwht()"]
    C --> E["Lloyd-Max квантизация (b-1 бит)<br/>tbq_c3[8] / tbq_c4[16]<br/>статичный кодбук, без калибровки"]
    D --> E
    E --> F{"*p*-вариант?<br/>tbq3/tbq4 vs tbqp3/tbqp4"}
    F -->|нет| G["block_tbqX_Y"]
    F -->|да| H["QJL-коррекция остатка (1 бит)<br/>1-битная проекция, cpy-utils.cuh ~273"]
    H --> G
    G --> I["упаковано в KV-кэш<br/>ggml-common.h:295-506"]
    I -.->|чтение, см. §4| J["K: vec_dot_fattn_vec_KQ_tbq*()<br/>dequant-free"]
    I -.->|чтение, см. §4| K["V: tbq_iwht_64() + combine"]
```

## 3. Домен: Type Registry — иерархия типов

`classDiagram` вместо ASCII-таблицы: показывает, что реестр — не один плоский список,
а связка enum → type_traits → конкретные C-структуры блоков, которые уже описаны
в Quantization Codec (§2).

```mermaid
classDiagram
    class ggml_type {
        <<enum, ggml.h:424-455>>
        GGML_TYPE_TBQ3_0 = 43
        GGML_TYPE_TBQ4_0
        GGML_TYPE_TBQP3_0..TBQP4_4
        GGML_TYPE_TBQV3_1 = 64
        GGML_TYPE_AMX3_1
        GGML_TYPE_AMXV3_1
        GGML_TYPE_TBQ3_0_relocated = 65
    }
    class type_traits {
        <<таблица, ggml.c:938-1073>>
        +string type_name
        +int blck_size
        +int type_size
        +bool is_quantized
    }
    class block_tbq3_0 {
        <<value object>>
        quantized residual, 3-bit, WHT-домен
    }
    class block_tbq4_0 {
        <<value object>>
        quantized residual, 4-bit
    }
    class block_tbqp3_0 {
        <<value object>>
        2-bit Lloyd-Max + 1-bit QJL residual
    }
    class block_tbq3_1 {
        <<value object, §5>>
        +ol_idx[2]
        +ol_val[2]
        quantized residual + outlier isolation
    }
    class block_amx3_1 {
        <<value object, гибрид, §4>>
        Part A: WHT quantized (50B)
        Part B: polar (r,φ) (58B) = 108B итого
    }
    class block_tbqv3_1 {
        <<value object>>
        "V-партнёр" для симметричных схем
    }

    ggml_type "1" --> "1" type_traits : индекс в таблицу
    type_traits ..> block_tbq3_0 : type_size = sizeof()
    type_traits ..> block_tbq4_0 : type_size = sizeof()
    type_traits ..> block_tbqp3_0 : type_size = sizeof()
    type_traits ..> block_tbq3_1 : type_size = sizeof()
    type_traits ..> block_amx3_1 : type_size = sizeof()
    type_traits ..> block_tbqv3_1 : type_size = sizeof()
```

## 4. Домен: Attention Scoring — TriAttention scoring/eviction

`sequenceDiagram` вместо ASCII-схемы: явно показывает порядок вызовов между decode-циклом,
блоком в кэше и TriAttention-ядром — то, что в ASCII можно было только подписать стрелкой.

```mermaid
sequenceDiagram
    participant Init as "Инициализация<br/>(--triattention)"
    participant Kernel as "triattention.cu"
    participant Cache as "block_amx3_1 в KV-кэше"
    participant Score as "importance score"
    participant Evict as "Top-B eviction"

    Init->>Kernel: tria_load() — калибровочный бинарник TRIA v2
    Kernel-->>Init: таблица центроидов TRIA_R_CENT (Rayleigh Lloyd-Max)

    loop на каждом шаге decode, для каждого K-блока
        Kernel->>Cache: читает Part B (58B, полярные r,φ)
        Note over Cache,Kernel: БЕЗ деквантизации — тождество<br/>Парсеваля: WHT сохраняет норму,<br/>|r| валиден без обратного WHT
        Cache-->>Kernel: (r, φ)
        Kernel->>Score: f(r, φ, TRIA_R_CENT)
        Score-->>Evict: importance score
    end
    Evict->>Evict: Top-B (--tri-budget) + attention-sink (--tri-keep-first N)
    Note right of Evict: пересчёт раз в --tri-interval шагов
    Evict-->>Kernel: подмножество «выживших» блоков
    Kernel->>Kernel: обычный flash-attn по Part A этих блоков (см. §5)
```

## 5. Домен: Attention Scoring — обычный flash-attention пайплайн

```mermaid
flowchart TD
    Q["Q (в WHT-домене)"] --> Dot["vec_dot_fattn_vec_KQ_tbq*()<br/>dequant-free дот-продукт"]
    K["K-кэш (квантован, WHT-домен)"] --> Dot
    Dot --> Softmax["softmax(QKᵀ/√d)"]
    Softmax --> Combine["IWHT(V) + weighted combine"]
    V["V-кэш (квантован)"] --> Combine
    Combine --> Out["выход attention"]
```

## 6. Домен: Precision-Preservation — outlier isolation (write / read)

```mermaid
flowchart TD
    subgraph Write["Запись (write path), head_dim=128, ДО WHT"]
        A1["сырой K-вектор"] --> A2["найти 2 канала с макс |x|<br/>«outlier»-каналы"]
        A2 -->|"ol_idx[2] + ol_val[2] (fp16)<br/>откладываются в сторону"| A5["block_tbq3_1 / block_amx3_1"]
        A2 -->|"остаток (outlier-каналы исключены)"| A3["WHT-ротация (§2)"]
        A3 --> A4["Lloyd-Max квантизация (b-1 бит)"]
        A4 -->|"слияние"| A5
    end
    subgraph Read["Чтение (read path), дот-продукт Q·K"]
        B1["vec_dot_fattn_vec_KQ_tbq3_1<br/>fattn-common.cuh"] --> B2["warp_reduce"]
        B2 --> B3["+ коррекция outlier'ов<br/>fattn-vec.cuh, ПОСЛЕ warp_reduce<br/>scale · Σ Q_raw[idx] · ol_val"]
        B3 --> B4["итоговый QKᵀ-скор"]
    end
    A5 -.->|"используется при чтении"| B1
```

Тумблер применения: `tbq3_1` (K, head_dim=128) — всегда включён (intrinsic); `amx3_1`
(TriAttention-гибрид) — через `AMX3_OUTLIERS` env → `g_amx3_outliers` (`set-rows.cu`).

## 7. Домен: Draft Verification — DSV4 MTP как машина состояний

`stateDiagram-v2` — цикл draft→verify по сути конечный автомат на 1 токен вперёд
(`nextn_predict_layers == 1`), это лучше показать как состояния, а не как поток данных.

```mermaid
stateDiagram-v2
    [*] --> TargetForward: llama_context.decode()<br/>основной граф DeepSeek-V4

    TargetForward --> DraftCarry: h_p, x_p+1<br/>common_speculative_impl_draft_mtp<br/>(speculative.cpp:420+)

    DraftCarry --> DraftGraph: graph_mtp.graph_mtp()<br/>deepseek4.cpp:2806-2844

    DraftGraph --> VerifyForward: x̂_p+2 (черновой токен)<br/>вход = [x_p+1, x̂_p+2] одним батчем

    state VerifyForward {
        [*] --> ReuseCheck
        ReuseCheck --> GraphReused: DSV4_VERIFY_REUSE=1
        ReuseCheck --> GraphRebuilt: DSV4_VERIFY_REUSE=0
        GraphReused --> [*]
        GraphRebuilt --> [*]
    }

    VerifyForward --> Accept: x̂_p+2 == токен target
    VerifyForward --> Reject: x̂_p+2 != токен target

    Accept --> TargetForward: p += 2<br/>2 токена за ~1.x forward pass
    Reject --> TargetForward: p += 1<br/>fallback на токен target-модели
```

## 8. Домен: Configuration/CLI Adapter — перевод имени в GGML-тип

```mermaid
flowchart TD
    U["Пользователь: -ctk tbq3 -ctv tbqp3<br/>-ctkd amx3 -ctvd amxv3 (draft, §7)"]
    U --> P["common/arg.cpp:2115-2165, 3615-3637, 3742<br/>парсинг -ctk/-ctv/-ctkd/-ctvd/--spec-type"]
    P --> F["kv_cache_type_from_str()<br/>common/arg.cpp:418-450"]
    F --> M1["tbq_shortcuts_k[«amx3»] = AMX3_1"]
    F --> M2["tbq_shortcuts_v[«amx3»] = AMXV3_1"]
    M1 --> Params["params.cache_type_k/v<br/>(GGML_TYPE_*, см. §3)"]
    M2 --> Params
    Params --> SC["server-context.cpp:824-962<br/>cparams / cparams_dft / cparams_mtp"]
    SC --> Alloc["src/llama-kv-cache.cpp, llama-context.cpp<br/>финальное разрешение суффикса _0…_4<br/>под фактический head_dim, в момент аллокации"]
    Help["get_all_kv_cache_types() (~452)<br/>обратный маппинг для --help"] -.->|"суффиксы _0…_4 скрыты (ACL)"| F
```
</script>
<script type="text/markdown" id="doc-mermaid-llama-cpp-fork"># Архитектура (Mermaid): форк llama.cpp целиком

> Версия [llama-cpp-fork.md](../Arch/llama-cpp-fork.md) в диаграммах Mermaid. Здесь —
> два уровня глубины, которых не было в ASCII-документе: 5-проходный алгоритм разбиения
> графа в `ggml_backend_sched_split_graph()` и полная машина состояний слота сервера
> (`enum slot_state`, `tools/server/server-context.cpp:42-49`).

## 1. Карта bounded context'ов

```mermaid
flowchart TB
    subgraph Tools["tools/ (равноправные бинарники)"]
        direction LR
        T1["tools/server<br/>llama-server"]
        T2["tools/cli<br/>llama-cli"]
        T3["tools/quantize<br/>llama-quantize"]
        T4["tools/llama-bench<br/>и другие…"]
    end
    Common["common/<br/>arg · sampling · chat<br/>(Supporting Subdomain)"]
    LlamaH["include/llama.h<br/>Anti-Corruption Layer"]
    subgraph Src["src/ (Core Domain движка)"]
        ML["Model Loading<br/>llama-model*.cpp"]
        IO["Inference Orchestration<br/>llama-context/batch"]
        TV["Tokenizer/Vocab<br/>llama-vocab.cpp"]
        KV["KV Cache Management<br/>llama-kv-cache*.cpp<br/>плагин: TurboQuant"]
        ML --> IO
        KV --> TV
    end
    Ggml["ggml/ (Generic Subdomain)<br/>тензорный движок и backend'ы"]
    subgraph Backends["равноправные backend'ы"]
        direction LR

## 3. Домен: GGML — как `ggml_backend_sched` разбивает граф на backend'ы

Это глубина, которой не было в ASCII-версии: `ggml_backend_sched_split_graph()`
(`ggml/src/ggml-backend.cpp:1016-1517`) — не просто «выбор backend'а», а 5-проходный
алгоритм. Разбиение на несколько split'ов — **обычный случай**, не редкий: даже
однo-GPU запуск почти всегда получает ≥2 split'а (входные токены/эмбеддинги по
умолчанию привязаны к последнему backend'у в списке приоритетов — CPU).

```mermaid
flowchart TD
    Start["ggml_cgraph (нераспределённый)"] --> P1
    P1["Pass 1 (:1037-1072)<br/>backend из уже размещённого буфера/весов<br/>ggml_backend_sched_backend_id_from_cur()"]
    P1 --> P2["Pass 2 (:1074-1152)<br/>«expand»: распространить GPU-backend<br/>вверх/вниз по неразмеченным op'ам,<br/>пропуская CPU (низший приоритет)"]
    P2 --> P3["Pass 3 (:1154-1213)<br/>апгрейд на более приоритетный backend<br/>при совпадении buffer type;<br/>оставшееся — «больше всего inputs»"]
    P3 --> P4["Pass 4 (:1215-1245)<br/>распространить на src/views"]
    P4 --> P5["Pass 5 (:1247-1377)<br/>обход узлов по порядку;<br/>backend сменился → закрыть текущий<br/>split, открыть новый"]
    P5 --> Splits["splits[]: struct ggml_backend_sched_split<br/>{backend_id, i_start, i_end, inputs[], graph}"]

    Splits --> Boundary{"src находится<br/>на другом backend'е?"}
    Boundary -->|да, buffer type не поддержан| Dup["создать дубликат-тензор<br/>ggml_dup_tensor_layout()<br/>зарегистрировать в split.inputs[]"]
    Boundary -->|нет| Same["используется как есть"]

    Dup --> Compute
    Same --> Compute
    Splits --> Compute["ggml_backend_sched_compute_splits() (:1571)<br/>копирует split.inputs через<br/>ggml_backend_tensor_copy[_async]()<br/>ПЕРЕД исполнением split.graph"]

    Override["ggml_backend_sched_set_tensor_backend()<br/>(:2003) — ручной оверрайд"] -.->|"Pass 1 никогда не<br/>перезаписывает"| P1
    Reserve["ggml_backend_sched_reserve()<br/>(:1890) — dry-run на measure-графе,<br/>только размер буферов"] -.-> Splits
```

Явных `GGML_OP_CPY`-узлов в граф не вставляется — копирование происходит на этапе
`compute_splits()`, а не как отдельный op в самом графе. Отладочный хук этого форка:
`DSV4_GRAPH_PROBE` (env, `ggml-backend.cpp:1380-1406`) — дампит число split'ов и их состав.

## 5. Домен: Server — машина состояний слота

Новая глубина: `enum slot_state` (`tools/server/server-context.cpp:42-49`), главный цикл
`update_slots()` (`:2376`). В ASCII-версии слот был просто «владеет слотами» одной строкой —
на деле это полноценный конечный автомат с явными под-фазами prefill/decode.

```mermaid
stateDiagram-v2
    [*] --> SLOT_STATE_IDLE

    SLOT_STATE_IDLE --> SLOT_STATE_STARTED: launch_slot_with_task()<br/>(:1456), задача назначена
    SLOT_STATE_IDLE --> SLOT_STATE_WAIT_OTHER: дочерний слот при n_cmpl>1<br/>(параллельные completions)

    SLOT_STATE_STARTED --> SLOT_STATE_PROCESSING_PROMPT: первый проход в батч-цикле (:2647)

    state SLOT_STATE_PROCESSING_PROMPT {
        [*] --> Prefill
        Prefill --> Prefill: батчами, пока не весь промпт
    }

    SLOT_STATE_PROCESSING_PROMPT --> SLOT_STATE_DONE_PROMPT: prompt.n_tokens() == task.n_tokens()<br/>(:3113-3114)
    SLOT_STATE_WAIT_OTHER --> SLOT_STATE_DONE_PROMPT: родитель дошёл до DONE_PROMPT,<br/>copy_state_to() (:3364-3384)

    SLOT_STATE_DONE_PROMPT --> SLOT_STATE_GENERATING: логиты сэмплированы<br/>для первого токена (:3417)
    SLOT_STATE_DONE_PROMPT --> SLOT_STATE_IDLE: embedding/rerank — сразу<br/>send_embedding/send_rerank + release()

    state SLOT_STATE_GENERATING {
        [*] --> Decode
        Decode --> Decode: автогенеративно,<br/>+ spec-decoding draft/accept (:3419-3475)
    }

    SLOT_STATE_GENERATING --> SLOT_STATE_IDLE: release() (:361-387) —<br/>stop/EOS/error/context-exceeded
    SLOT_STATE_PROCESSING_PROMPT --> SLOT_STATE_IDLE: release() при ошибке

    note right of SLOT_STATE_IDLE
        get_available_slot() выбирает слот по
        longest-common-prefix similarity или LRU
        среди НЕ-processing слотов (:1310-1362).
        /slots save/restore/erase применяются
        ТОЛЬКО к IDLE-слотам — иначе задача
        откладывается через queue_tasks.defer().
    end note
```

`server_prompt_cache` (`server-task.h:610-633`) ортогонален этой машине состояний: если
выбранный слот теряет >50% релевантного промпта (`f_keep < 0.5`), его KV сериализуется через
`slot.prompt_save()`/`prompt_load()` (`:1388-1405`) до перезаписи — так предыдущий разговор
переживает переназначение слота другому запросу.

## 3. Домен: MCP Integration — машина состояний подключения

Два уровня состояний из `tools/ui/src/lib/enums/mcp.enums.ts`, объединённые в
`HealthCheckState` (`types/mcp.d.ts:145-168`): грубый `HealthCheckStatus` (что видит UI) и
вложенный в него подробный `MCPConnectionPhase` (что реально происходит на транспорте).

```mermaid
stateDiagram-v2
    [*] --> IDLE

    IDLE --> CONNECTING: ensureInitialized() → doInitialize()<br/>(mcp.svelte.ts:579-698)

    state CONNECTING {
        [*] --> TRANSPORT_CREATING
        TRANSPORT_CREATING --> TRANSPORT_READY: mcp.service.ts:516→545
        TRANSPORT_READY --> INITIALIZING: :597
        INITIALIZING --> CAPABILITIES_EXCHANGED: :652
        CAPABILITIES_EXCHANGED --> LISTING_TOOLS: :672
        LISTING_TOOLS --> CONNECTED_PHASE: :695
    }

    CONNECTING --> SUCCESS: все фазы пройдены
    CONNECTING --> ERROR: catch в connect()<br/>(:582-594, 607-644)

    SUCCESS --> DISCONNECTED: transport.onclose<br/>(:535-541), сеть упала
    DISCONNECTED --> CONNECTING: autoReconnect()<br/>(mcp.svelte.ts:855-948)

    state CONNECTING {
        note left of TRANSPORT_CREATING
            backoff: initial 1000ms ×2 до 30000ms,
            таймаут попытки 15000ms,
            reconnectingServers: Set — без дублей
        end note
    }

    SUCCESS --> IDLE: MCPService.disconnect() (:731-756)<br/>явно снимает onclose/onerror —<br/>НЕ триггерит autoReconnect
    ERROR --> IDLE: shutdown()

    note right of ERROR
        HTTP 404 (session expired) →
        reconnectServer() (:803-840) —
        отдельный немедленный реконнект,
        не через backoff-цикл
    end note
```

Хранение состояния: `_healthChecks = $state<Record<string, HealthCheckState>>({})`
(`mcp.svelte.ts:87`) — реактивный **объект**, а не `Map`, ключ — id сервера;
`connections = new Map<string, MCPConnection>()` (`:89`) — нереактивная. Подключения
независимы: `doInitialize()` использует `Promise.allSettled` (`:626`), падение одного
сервера не блокирует остальные; глобальная ошибка выставляется только если упали все
(`:676-687`). Но переключение любого сервера пересобирает **весь** пул: `ensureInitialized()`
делает `shutdown()` (отключает все) и заново инициализирует включённые (`:599`).

## Поток данных между доменами

Один цикл генерации токена — от нажатия «отправить» в клиенте до рендера токена на
экране — пересекает все три домена. Диаграмма показывает этот путь; шаги повторяются
автогенеративно, по одному токену за проход, пока не встретится стоп-токен/лимит.

```

               │ [UI-FRONTEND] Chat Domain          │
               │ ChatForm → chatStore.sendMessage() │
               └────────────────────────────────────┘
                                  │  ① POST /v1/chat/completions (SSE)
                                  ▼
       ┌────────────────────────────────────────────────────┐
       │ [LLAMA-CPP-FORK] Server domain (tools/server)      │
       │ server-context.cpp: server_task → server-queue.cpp │
       └────────────────────────────────────────────────────┘
                                  │  ② llama_decode(ctx, batch)
                                  ▼
┌──────────────────────────────────────────────────────────────────┐
│ [LLAMA-CPP-FORK] Inference Orchestration (src/llama-context.cpp) │
│ llama_batch_allocr → llama_ubatch → строит ggml_cgraph           │
└──────────────────────────────────────────────────────────────────┘
                                  │  ③ узел графа обращается к KV-памяти
                                  ▼
  ┌───────────────────────────────────────────────────────────────┐
  │ [LLAMA-CPP-FORK] KV Cache Management (src/llama-kv-cache.cpp) │
  │ llama_kv_cache::find_slot() → ggml_set_rows()                 │
  └───────────────────────────────────────────────────────────────┘
                                  │  ④ делегирует физическое хранение/чтение
                                        блоков квантованному кодеку
                                  ▼
┌───────────────────────────────────────────────────────────────────┐
│ [TURBOQUANT-CORE] Quantization Codec + Attention Scoring domains  │
│ запись:  cpy-utils.cuh quantize_tbq*() — WHT → Lloyd-Max → (QJL)  │
│          → упаковка в block_tbqX_Y                                │
│ чтение:  fattn-vec.cuh vec_dot_fattn_vec_KQ_tbq*() — dequant-free │
│          dot-product + TriAttention eviction → softmax·V          │

                                  │  ⑤ логиты (выход attention → остаток графа)

```

Ключевое наблюдение: **TurboQuant не отдельный узел на пути запроса, а вставка внутри
KV Cache Management** (шаг ④) — сервер и клиент вообще не знают о его существовании,
компрессия полностью прозрачна снаружи домена `llama-cpp-fork`. Единственная видимая
снаружи точка входа — CLI-флаги `-ctk`/`-ctv`, разбираемые ещё на старте сервера
(см. [turboquant-core.md §7](./turboquant-core.md#7-домен-configurationcli-adapter-anti-corruption-layer)),
до начала цикла на диаграмме.

## 2. Домен: Quantization Codec

**Ubiquitous language:** *ротация* (WHT), *кодбук* (Lloyd-Max codebook), *остаток* (residual),
*QJL-коррекция*.

Это Core Domain всего форка — воплощение самой идеи TurboQuant: повернуть вектор случайной
ортогональной матрицей (Walsh-Hadamard Transform, а не произвольная матрица — она даёт
O(d·log d) вместо O(d²)), затем квантовать компоненты по заранее посчитанной Lloyd-Max сетке
(оптимальной для нормального распределения, в которое WHT превращает исходное произвольное
распределение), и опционально добавить 1-битную QJL-коррекцию остатка.

- `ggml/src/ggml-cuda/cpy-utils.cuh` (~2000 строк) — GPU-функторы `quantize_*` на запись:
  `tbq3` (строка ~156), `tbqp3` = WHT + 2-bit Lloyd-Max + 1-bit QJL (~273), `tbq4` (~547),
  double-WHT для `head_dim=64` (~1708/1781/1849). Таблицы центроидов `tbq_c3`/`tbq_c4`,
  случайный вектор знаков `tbq_signs_64`.
- `ggml/src/ggml-quants.c:2526-2600` — CPU-референс: `tbq_iwht_64()` (обратный WHT),
  `dequantize_row_tbq3_2/tbq4_2`.
- `ggml/src/ggml-cuda/fwht.cuh` / `fwht.cu` — CUDA-ядро прямого WHT (`ggml_cuda_op_fwht`);
  WHT для Q (запросов) отдельно в `convert.cu:846-960` (`tbq_q_wht12_cuda`).
- QJL-коррекция остатка встроена прямо в `tbqp*`-функторы `cpy-utils.cuh`, читается при
  attention в `fattn-common.cuh:586+` и `fattn-vec.cuh`.
- Блочные структуры (**value objects** в терминах DDD — неизменяемые, без идентичности):
  `ggml/src/ggml-common.h:295-506` — `block_tbq3_0/4_0/tbqp3_0…tbqp4_4`, размеры проверяются
  через `static_assert`.

## 4. Домен: Attention Scoring

**Ubiquitous language:** *flash attention*, *TriAttention*, *eviction*, *attention sink*.

- **Flash-attn vec path** (основной, покрывает все типы): `ggml/src/ggml-cuda/fattn-vec.cuh` —
  WHT запроса (Q) прямо в ядре, dot-product ключа (K) через `vec_dot_fattn_vec_KQ_tbq*`,
  обратный WHT (IWHT) значения (V) и комбинирование на выходе.
- **Flash-attn MMA (tensor-core) path** — в разработке (см. `turboquant/FATTN_MMA_TBQ_PORT.md`):
  `ggml/src/ggml-cuda/fattn-mma-tbq.cu` (диспетчер) + `fattn-mma-f16.cuh:462-760`
  (шов дeквантизации в tile-loader'е) + ~70 сгенерированных
  `ggml/src/ggml-cuda/template-instances/fattn-vec-instance-*tbq*.cu`. На момент последнего
  апдейта статуса: готова только V-сторона для D=128 (`TBQ3_1`/`TBQV3_1`/`AMXV3_1`),
  K-сторона и outlier-путь `AMX3_1` отложены (SHELVED).
- **TriAttention** (отдельный алгоритм отбора/вытеснения токенов, не из статьи TurboQuant, а
  портирован поверх неё — см. `turboquant_impl.tex`): `ggml/src/ggml-cuda/triattention.cu`/`.cuh`.
  Загружает калибровочный бинарник `TRIA v2` (`tria_load`), читает поле `(r, φ)` полярных
  координат прямо из `block_amx3_1` без дeквантизации (используя сохранение нормы при WHT —
  тождество Парсеваля), считает Rayleigh-центроиды `TRIA_R_CENT`, делает Top-B eviction и
  attention-sink. Флаги CLI: `--triattention`, `--tri-budget`, `--tri-interval`,
  `--tri-keep-first`.

## 5. Домен: Precision-Preservation (outlier isolation)

**Ubiquitous language:** *outlier*, *ol_idx/ol_val*, *protected layers*.

Механизм точечной защиты точности внутри блока (по мотивам `turboquant/OUTLIER_ISOLATION_STATUS.md`):
для каждого блока **до** WHT-ротации выделяются 2 канала с наибольшим `|x|`, сохраняются как
`ol_idx[2]` + `ol_val[2]` (fp16) поверх блока, остаток квантуется как обычно, а при чтении в
дот-продукт добавляется `scale · Σ Q_raw[idx] · ol_val`.

- Постоянно включён (intrinsic) для `tbq3_1` (K, только `head_dim=128`).
- Для отдельной TriAttention-линейки `amx3_1` включается через переменную окружения
  `AMX3_OUTLIERS` (глобальный тумблер `g_amx3_outliers` в `ggml-cuda/set-rows.cu`).
- Эмпирически полезен только при `head_dim ≤ 128`; на 256/512 выигрыша нет, на 64 не проверялось.
- Код: структуры полей — `ggml/src/ggml-common.h`; квантизация — `ggml-cuda/cpy-utils.cuh`;
  коррекция дот-продукта — `ggml-cuda/fattn-vec.cuh` (после `warp_reduce`, отдельно от
  основной `vec_dot_fattn_vec_KQ_tbq3_1` в `fattn-common.cuh`); guard'ы на несовпадение
  типов K/V — `src/llama-context.cpp` / `llama-kv-cache.cpp`.

Отдельно от блочного outlier isolation стоит идея **защищённых слоёв** (protected layers,
упоминается в пользовательской документации/README): первые и последние слои трансформера
переносят основной сигнал через residual stream, поэтому их KV предпочтительно не квантовать
вовсе, а не изолировать выбросы внутри блока — это управляется на уровне Configuration/CLI
Adapter (§7), а не в самом кодеке.

       │ основной dequant-free дот-продукт по WHT-остатку          │
       └───────────────────────────────────────────────────────────┘
                                     │  warp_reduce (сумма по потокам варпа)
                                     ▼
┌─────────────────────────────────────────────────────────────────────────┐
│ + коррекция outlier'ов  (ggml-cuda/fattn-vec.cuh, ПОСЛЕ warp_reduce)    │
│ scale · Σ Q_raw[idx] · ol_val — Q берётся в исходном, НЕ WHT-повёрнутом │
│ виде: тождество Парсеваля здесь не нужно, это отдельное слагаемое       │
└─────────────────────────────────────────────────────────────────────────┘
                                     │
                                     ▼
                           ┌───────────────────┐
                           │ итоговый QKᵀ-скор │
                           └───────────────────┘
```

Смысл: без изоляции 1-2 экстремальных по модулю канала вносили бы основной вклад в ошибку
квантизации (Lloyd-Max сетка рассчитана на «типичный» диапазон нормального распределения
после WHT). Вынося их из основного потока и складывая коррекцию отдельным, некватованным
слагаемым уже на этапе scoring'а, кодек не обязан «тратить» на них разрядность кодбука.

## 6. Домен: Draft Verification (DSV4 / MTP)

**Ubiquitous language:** *MTP (Multi-Token Prediction)*, *draft*, *verify*, *nextn*.

Спекулятивное декодирование, специализированное под DeepSeek-V4 — самостоятельный
bounded context, который *использует* Quantization Codec (сжатый KV черновой и основной
моделей), но не является его частью.

- Базовая реализация: `common/speculative.cpp:33` — регистрирует тип `"draft-mtp"`,
  `struct common_speculative_impl_draft_mtp` (~420) хранит пары `(h_p, x_{p+1})` между батчами.
- DSV4-специфичный граф: `src/models/deepseek4.cpp:2806-2844` —
  `llama_model_deepseek4::graph_mtp::graph_mtp()`; требует `nextn_predict_layers == 1` и
  тензоры `layer.nextn.{e_proj,h_proj,hc_head_fn}` (готовятся офлайн скриптами
  `turboquant/ds4_mtp_to_shard.py` / `ds4_fp4_bake_mtp.py`). Повторное использование
  верифицирующего графа управляется переменной окружения `DSV4_VERIFY_REUSE`
  (`deepseek4.cpp` ~2140-2231).
- Рабочие журналы: `turboquant/DSV4_PERF_STATUS.md` (тюнинг производительности),
  `turboquant/DFLASH_RESEARCH.md` (нереализованное исследование диффузионного драфтинга).

### ASCII-схема цикла draft→verify

`nextn_predict_layers == 1` (проверяется assert'ом) — DSV4 в этой реализации предсказывает
черновой токен ровно на 1 шаг вперёд, без дерева спекуляций.

```
Шаг p: обычный forward pass основной (target) модели
                 ┌──────────────────────────────────────────────────────┐
                 │ llama_context::decode()                              │
                 │ основной граф DeepSeek-V4 (src/models/deepseek4.cpp) │
                 └──────────────────────────────────────────────────────┘
                                             │  h_p — скрытое состояние позиции p
                                                x_{p+1} — сэмплированный целевой токен
                                             ▼
                    ┌────────────────────────────────────────────────┐
                    │ common_speculative_impl_draft_mtp              │
                    │ (common/speculative.cpp:420+, тип "draft-mtp") │
                    │ переносит пару (h_p, x_{p+1}) в следующий батч │
                    └────────────────────────────────────────────────┘
                                             │
                                             ▼
             ┌──────────────────────────────────────────────────────────────┐
             │ graph_mtp::graph_mtp()  (src/models/deepseek4.cpp:2806-2844) │
             │ вход: h_p ⊕ embed(x_{p+1})                                   │
             │ тензоры: layer.nextn.{e_proj, h_proj, hc_head_fn}            │
             │ (испечены офлайн: ds4_mtp_to_shard.py / ds4_fp4_bake_mtp.py) │
             └──────────────────────────────────────────────────────────────┘
                                             │  x̂_{p+2} — черновой (draft) токен
                                             ▼
Шаг p+1: verify forward pass (тот же основной граф)
            ┌───────────────────────────────────────────────────────────────┐
            │ вход = [x_{p+1}, x̂_{p+2}] одним батчем, тот же основной граф │
            │ DSV4_VERIFY_REUSE=1 → граф переиспользуется вместо пересборки │
            │ (перф-оптимизация, см. DSV4_PERF_STATUS.md)                   │
            └───────────────────────────────────────────────────────────────┘
                                             │
                                             ▼
                              ┌───────────────────────────┐
                              │ x̂_{p+2} == токен target? │
                              └───────────────────────────┘
             совпал                                         не совпал
                                             │
                ┌────────────────────────────┴──────────────────┐
                ▼                                               ▼
┌───────────────────────────────┐      ┌─────────────────────────────────────────────────┐
│ принять x̂_{p+2}              │      │ отбросить x̂_{p+2}                              │
│ 2 токена за ~1.x forward pass │      │ взять токен target-модели как обычно (fallback) │
└───────────────────────────────┘      └─────────────────────────────────────────────────┘
                │                                               │
                └────────────────────────────┬──────────────────┘
                                             ▼
                           p += 2 (accept) / p += 1 (reject)
                                → следующая итерация с шага p
```

Экономия — не в качестве (draft и verify используют одни и те же веса target-модели через
`hc_head_fn`, а не отдельную уменьшенную модель), а в том, что при принятом драфте один
verify-forward-pass отдаёт сразу 2 токена вместо одного обычного decode-шага.

## 7. Домен: Configuration/CLI Adapter (Anti-Corruption Layer)

**Ubiquitous language:** *shorthand*, *cache-type-k/v*.

Это классический **Anti-Corruption Layer**: он переводит человекочитаемые имена
(`"tbq3"`, `"amx3"`, `"turbo3"` в пользовательских README) в машинные `GGML_TYPE_*` из
Type Registry (§3), не давая пользовательскому словарю просочиться внутрь кодека.

- `common/arg.cpp:2115-2165` — парсинг `-ctk/--cache-type-k`, `-ctv/--cache-type-v`
  (`kv_cache_type_from_str`); `3615-3637` — вариант для draft-модели (`-ctkd/-ctvd`);
  `3742` — `--spec-type`.
- `common/arg.cpp:418-450` — сама функция `kv_cache_type_from_str()` с таблицами
  `tbq_shortcuts_k` / `tbq_shortcuts_v` (например `"tbq3" → GGML_TYPE_TBQ3_0`; K и V для
  `"amx3"` асимметрично мапятся на `AMX3_1` и `AMXV3_1` — так и задумано). Обратный маппинг
  для `--help` — `get_all_kv_cache_types()` (~452), скрывает внутренние суффиксы `_0…_4`.
- Потребление: `tools/server/server-context.cpp:824-962` прокидывает
  `params.cache_type_k/v` в `cparams_dft`/`cparams_mtp` для контекстов draft-модели;
  финальное разрешение суффикса под конкретный `head_dim` происходит позже, при аллокации
  кэша, в `src/llama-kv-cache.cpp` / `llama-context.cpp`.

## 8. Таблица типов (сводка)

| Имя (short)     | Бит/значение | Что это                                   | Домен                     |
|------------------|:---:|--------------------------------------------|----------------------------|
| `tbq3`           | ~3  | WHT + Lloyd-Max, без QJL                    | Quantization Codec         |
| `tbq4`           | ~4  | WHT + Lloyd-Max, без QJL, точнее             | Quantization Codec         |
| `tbqp3` / `tbqp4`| ~3/4 + 1 | + 1-бит QJL-коррекция остатка          | Quantization Codec         |
| `amx3` / `amxv3` | —   | гибрид: WHT-часть + полярная (r,φ) часть для TriAttention | Attention Scoring |
| `tbqv3`          | ~3  | «V-партнёр» для симметричных схем           | Quantization Codec         |

Асимметричные схемы (например K в `q8_0`, V в `tbq3`) собираются не отдельным типом, а
комбинацией `-ctk`/`-ctv` на уровне Configuration/CLI Adapter (§7).

- `turboquant/paper/turboquant_impl.tex` — техническая статья по реализации (мат. обоснование).
- `turboquant/FATTN_MMA_TBQ_PORT.md` — статус портирования tensor-core MMA пути.
- `turboquant/DSV4_PERF_STATUS.md`, `turboquant/DFLASH_RESEARCH.md` — MTP/спекулятивное декодирование.
- `turboquant/OUTLIER_ISOLATION_STATUS.md` — outlier isolation в деталях.
- `turboquant/README.md` — пользовательская документация (флаги CLI, пресеты, PPL-таблицы).

<script type="text/markdown" id="doc-ascii-llama-cpp-fork"># Архитектура: форк llama.cpp целиком (Generic Subdomain)

> Домен-документ в стиле DDD. Описывает базовый движок инференса — **upstream-происхождение**
> этого форка. Специфика TurboQuant (KV-компрессия) вынесена в отдельный core-domain документ:
> [turboquant-core.md](./turboquant-core.md). UI-клиент — в [ui-frontend.md](./ui-frontend.md).

## 1. Карта bounded context'ов

**Правило зависимостей (важно для навигации):** `tools/` и `common/` никогда не трогают
`ggml/` напрямую — только публичный C API `include/llama.h`, реализованный в `src/`. `src/` —

пределами самого `ggml/`. Backend-поддиректории (`ggml-cuda/`, `ggml-metal/`, `ggml-cpu/`, …) —

не знают, какой backend физически исполняет граф.

## 2. Домен: GGML — тензорный движок и backend'ы (`ggml/`)

**Ubiquitous language:** *тензор*, *граф вычислений (cgraph)*, *backend*, *scheduler*, *аллокатор*.

Generic Subdomain — переиспользуемая библиотека, не завязанная на конкретную архитектуру
модели. Основные объекты (**entities/aggregates**):

- `struct ggml_tensor` (`ggml/include/ggml.h:696`) — узел графа: форма, тип, данные/операция.
- `struct ggml_context`, `ggml_cgraph` — арена памяти и граф вычислений; строятся и исполняются
  в `ggml/src/ggml.c` (8130 строк).
- `ggml/src/gguf.cpp` — чтение/запись контейнера GGUF, `struct gguf_context`.
- Backend-абстракция (**repository pattern** — прячет физическое устройство за интерфейсом):
  `ggml/include/ggml-backend.h` — непрозрачные `ggml_backend_t`, `ggml_backend_buffer_t`,
  `ggml_backend_buffer_type_t`, `ggml_backend_sched_t`.
- Аллокация: `ggml/src/ggml-alloc.c` — `ggml_tallocr` (один тензор), `ggml_gallocr_t`
  (весь граф целиком, с резервированием буфера через `ggml_gallocr_reserve`).
- Саморегистрация backend'ов: `ggml/src/ggml-backend-reg.cpp` — конструктор
  `ggml_backend_registry` вызывает `register_backend(ggml_backend_cuda_reg())`,
  `ggml_backend_metal_reg()`, `ggml_backend_cpu_reg()` и т.д.
- Реализации backend'ов — равноправные поддиректории: `ggml-cuda/` (файлы `.cu`/`.cuh` на
  операцию), `ggml-metal/` (`ggml-metal-device.m`, `ggml-metal-ops.cpp`, `.metal`-шейдеры),
  `ggml-cpu/` (`ggml-cpu.c`, `ops.cpp`, `repack.cpp`, SIMD под конкретную архитектуру CPU).

## 3. Домен: Model Loading / формат GGUF

**Ubiquitous language:** *веса*, *mmap*, *tensor weight*, *architecture*.

- `gguf_init_from_file` (`ggml/include/gguf.h`) парсит бинарный контейнер в `gguf_context`.
- `struct llama_model_loader` (`src/llama-model-loader.h:31`) — **репозиторий** поверх него:
  хранит `weights_map` (`std::map<std::string, llama_tensor_weight>`), `llama_mmaps mappings`,
  `kv_overrides`, флаги `TENSOR_NOT_REQUIRED`/`TENSOR_DUPLICATED`; каждый `llama_tensor_weight`
  хранит смещение в файле и валидируется по `gguf_get_data_offset`/`gguf_get_tensor_offset`.
- `struct llama_model` (`src/llama-model.h:547`) — итоговая **aggregate root** модели в
  памяти: `llm_type`, `llm_arch`, `llama_hparams`, `llama_vocab`, десятки именованных
  `ggml_tensor *` (веса), включая массивы `struct llama_layer` по слоям.
- `src/llama-arch.cpp/h` — маппинг строкового имени архитектуры из GGUF в enum `llm_arch`.
- `src/llama-model.cpp` (2722 строки) — строит архитектурно-специфичный граф вычислений
  из загруженных весов (в том числе `deepseek4.cpp`, см. [turboquant-core.md §6](./turboquant-core.md)).

## 4. Домен: Inference Orchestration

## 5. Домен: KV Cache Management

**Ubiquitous language:** *cell*, *sequence*, *slot*, *memory interface*.

Это **общая абстракция**, в которую подключается TurboQuant (см.
[turboquant-core.md](./turboquant-core.md)) — сам этот домен ничего не знает про квантизацию.

- `struct llama_memory_i` (`src/llama-memory.h:71`) — абстрактный интерфейс памяти,
  который реализуют все виды кэша.
- `class llama_kv_cache : public llama_memory_i` (`src/llama-kv-cache.h:20`) — обычный
  унифицированный (не-SWA) кэш: определяет `slot_info` (маппинг токенов микробатча на ячейки
  по потокам, используется с `ggml_set_rows`) и `stream_copy_info` для мульти-sequence
  потоков; поячеечный учёт (позиция, множество seq-id) — в `class llama_kv_cells`
  (`src/llama-kv-cells.h:32`).
- `llama_kv_cache_iswa` (`src/llama-kv-cache-iswa.h`) — обёртка для interleaved
  sliding-window-attention вариантов.
- `src/llama-kv-cache-dsa.h` — второй экземпляр `llama_kv_cache` для ключей
  lightning-indexer (поддержка DeepSeek sparse attention).

## 2. Домен: Chat (Core Domain клиента)

**Ubiquitous language:** *разговор (conversation)*, *сообщение*, *ветка (branch)*, *стриминг*,
*регенерация*.

### Aggregates (stores)

- **`chatStore`** — aggregate root активного взаимодействия: флаги
  загрузки/стриминга по разговору; состояние обработки (тайминги); жизненный цикл стрима
  (старт/стоп/abort); обработка ошибок (диалог); CRUD сообщений (добавить/отправить/
  обновить/удалить); регенерация и ветвление ответов; режим инлайн-редактирования;
  вспомогательные утилиты (опции API, разбор таймингов).
- **`conversationsStore`** — репозиторий разговоров: инициализация/загрузка; CRUD
  разговора; управление сообщениями активного разговора; навигация по веткам-сиблингам;
  per-chat переопределения MCP-серверов (включён/выключен); импорт/экспорт.
- **`agenticStore`** — состояние агентной сессии (multi-turn tool-calling) на разговор +
  общий флаг «что-то выполняется»; получение/обновление/очистка сессии; конфигурация
  (макс. число ходов, строк превью); сам агентный цикл — вызов инструментов, нормализация
  tool-calls, стриминг результатов вызова.

## 3. Домен: MCP Integration (Model Context Protocol)

**Ubiquitous language:** *MCP-сервер*, *tool*, *resource*, *prompt*, *подключение*.

Отдельный bounded context: соединяет чат с внешними MCP-серверами, чтобы их инструменты,
промпты и ресурсы стали доступны LLM в агентном цикле — с возможностью включать/выключать
per-conversation и просматривать/прикреплять ресурсы.

- **`mcpStore`** — состояние подключений/health-check (Maps); init/shutdown/получение
  соединения; health-check; CRUD серверов; листинг/исполнение инструментов; операции с
  промптами.
- **`mcpResourceStore`** — состояние ресурсов/кэша/подписок/вложений; discovery ресурсов;
  кэширование контента; live-подписки на обновления; управление chat-вложениями.
- **`MCPService`** — транспортный слой: WebSocket / StreamableHTTP / SSE; connect, tools,
  prompts, resources, completions.

### Компоненты

```
MCP UI
 ├─ SettingsMcpServers        [переименован из McpServersSettings]
 ├─ McpServerCard (+ header/actions/edit/delete/tools-list)
 ├─ McpResourcesBrowser
 ├─ McpResourcePreview
 ├─ ChatFormActionAddMcpServersSubmenu   [заменил отдельный McpServersSelector]
 ├─ McpServerForm
 ├─ McpServerIdentity
 ├─ McpCapabilitiesBadges
 └─ McpConnectionLogs
```

`conversationsStore` хранит per-chat переопределения (§2), `agenticStore` потребляет
инструменты `mcpStore` во время выполнения агентного цикла.

Упрощённая mermaid-версия оригинального документа — не отдельное повествование, а более
плоский срез той же схемы: категории те же (Routes, Components, Hooks, Stores, Services,
Storage, APIs, External MCP), но компоненты одним плоским списком без подгрупп

          qlines.push(lines[i].replace(/^>\s?/, ""));
          i++;
        }
        var qHtml = "<blockquote>" + qlines
          .join("\n")
          .split(/\n{2,}/)
          .map(function (p) { return "<p>" + inl(p.replace(/\n/g, " ")) + "</p>"; })
          .join("") + "</blockquote>";
        if (!sawFirstH2) introHtml.push(qHtml); else html.push(qHtml);
        continue;
      }

      if (/^\|/.test(line)) {
        var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
        var headerCells = rows[0].split("|").slice(1, -1).map(function (c) { return c.trim(); });
        var bodyRows = rows.slice(2).map(function (r) {
          return r.split("|").slice(1, -1).map(function (c) { return c.trim(); });
        });
        var t = ['<div class="table-wrap"><table><thead><tr>'];
        headerCells.forEach(function (c) { t.push("<th>" + inl(c) + "</th>"); });
        t.push("</tr></thead><tbody>");
        bodyRows.forEach(function (r) {
          t.push("<tr>");
          r.forEach(function (c) { t.push("<td>" + inl(c) + "</td>"); });
          t.push("</tr>");
        });
        t.push("</tbody></table></div>");
        html.push(t.join(""));
        continue;
      }

      if (/^-\s+/.test(line)) {
        var items = [];
        while (i < lines.length && (/^-\s+/.test(lines[i]) || (lines[i].trim() !== "" && items.length && !isStop(lines[i])))) {
          if (/^-\s+/.test(lines[i])) {
            items.push([lines[i].replace(/^-\s+/, "")]);
          } else {
            items[items.length - 1].push(lines[i].trim());
          }
          i++;
        }
        var ulHtml = "<ul>" + items.map(function (parts) { return "<li>" + inl(parts.join(" ")) + "</li>"; }).join("") + "</ul>";
        if (!sawFirstH2) introHtml.push(ulHtml); else html.push(ulHtml);
        continue;
      }

      if (line.trim() === "") { i++; continue; }

      var pbuf = [];
      while (i < lines.length && !isStop(lines[i])) {
        pbuf.push(lines[i]);
        i++;
      }
      var pHtml = "<p>" + inl(pbuf.join(" ")) + "</p>";
      if (!sawFirstH2) introHtml.push(pHtml); else html.push(pHtml);
    }

    return { html: html.join("\n"), intro: introHtml.join("\n"), toc: toc };
  }

  // ---- render all (source, doc) pairs ----
  var rendered = {}; // rendered["mermaid:turboquant-core"] = {...}
  SOURCES.forEach(function (s) {
    s.docs.forEach(function (d) {
      var scriptId = "doc-" + s.id + "-" + d.id;
      var src = document.getElementById(scriptId).textContent;
      var key = s.id + ":" + d.id;
      rendered[key] = renderMarkdown(src, s.id + "-" + d.id, s.id);
    });
  });

  var mainEl = document.getElementById("main");
  var currentSource = "mermaid";
  var currentDoc = null;

  function buildDocPanel(sourceId, d, idx, docsInSource) {
    var key = sourceId + ":" + d.id;
    var r = rendered[key];
    var section = document.createElement("article");
    section.className = "doc";
    section.id = "doc-panel-" + sourceId + "-" + d.id;
    if (d.channel) section.setAttribute("data-channel", d.channel);

    var sourceLabel = SOURCE_BY_ID[sourceId].label;
    var eyebrow = d.channel
      ? '<div class="doc-eyebrow"><span class="rule"></span>' + sourceLabel + " wiki · " + d.title + "</div>"
      : '<div class="doc-eyebrow"><span class="rule"></span>' + sourceLabel + "</div>";

    var next = docsInSource[idx + 1];
    var prev = docsInSource[idx - 1];
    var footNav = '<footer class="doc-end">' +
      (prev ? '<a class="doc-nav-link" href="#" data-nav="' + sourceId + ":" + prev.id + '">← ' + prev.title + "</a>" : "<span></span>") +
      (next ? '<a class="doc-nav-link" href="#" data-nav="' + sourceId + ":" + next.id + '">' + next.title + " →</a>" : "<span></span>") +
      "</footer>";

    section.innerHTML = eyebrow + r.html;
    var h1 = section.querySelector("h1");
    if (h1 && r.intro) {
      var introDiv = document.createElement("div");
      introDiv.className = "doc-intro";
      introDiv.innerHTML = r.intro;
      h1.insertAdjacentElement("afterend", introDiv);
    }
    section.insertAdjacentHTML("beforeend", footNav);
    return section;
  }

  // ---- build every (source, doc) panel up front, synchronously, before the
  // page finishes its initial script pass. Whatever mechanism renders the
  // ```mermaid blocks (a one-time scan right after load, or a live DOM
  // observer) sees the full set of diagrams from the start; nothing is
  // inserted later purely on user navigation. ----
  SOURCES.forEach(function (s) {
    s.docs.forEach(function (d, idx) {
      var panel = buildDocPanel(s.id, d, idx, s.docs);
      mainEl.appendChild(panel);
    });
  });
  document.getElementById("doc-panel-mermaid-readme").classList.add("active");

  // ---- sidebar: build both navsets upfront (no diagrams inside, safe) ----
  SOURCES.forEach(function (s) {
    var navsetEl = document.getElementById("navset-" + s.id);
    s.docs.forEach(function (d) {
      var key = s.id + ":" + d.id;
      var r = rendered[key];

      var group = document.createElement("div");
      group.className = "navgroup";
      if (d.channel) group.setAttribute("data-channel", d.channel);
      group.id = "navgroup-" + s.id + "-" + d.id;

      var btn = document.createElement("button");
      btn.className = "navgroup-btn";
      btn.type = "button";
      btn.innerHTML =
        (d.channel ? '<span class="chan-dot"></span>' : '<span class="chan-dot" style="background:var(--text-faint)"></span>') +
        "<span>" + d.title + "</span>" +
        '<span class="count">' + (r.toc.length ? r.toc.length : "") + "</span>";
      btn.addEventListener("click", function () { navigate(key, null); });
      group.appendChild(btn);

      var sub = document.createElement("div");
      sub.className = "subnav";
      r.toc.forEach(function (t) {
        var a = document.createElement("a");
        a.href = "#" + t.id;
        a.textContent = t.num + ". " + t.title;
        a.addEventListener("click", function (ev) {
          ev.preventDefault();
          navigate(key, t.id);
        });
        sub.appendChild(a);
      });
      group.appendChild(sub);
      navsetEl.appendChild(group);
    });
  });

  // event delegation for data-nav links (in content + footer)
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-nav]");
    if (!el) return;
    e.preventDefault();
    navigate(el.getAttribute("data-nav"), null);
  });

  function setActiveSource(sourceId) {
    currentSource = sourceId;
    document.querySelectorAll(".navset").forEach(function (n) {
      n.classList.toggle("active", n.getAttribute("data-source") === sourceId);
    });
    document.querySelectorAll("#sourceSwitch button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-source") === sourceId ? "true" : "false");
    });
  }

  document.getElementById("sourceSwitch").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-source]");
    if (!btn) return;
    var sourceId = btn.getAttribute("data-source");
    if (sourceId === currentSource) return;
    navigate(sourceId + ":" + (currentDoc ? currentDoc.split(":")[1] : "readme"), null);
  });

  function navigate(key, sectionId) {
    var parts = key.split(":");
    var sourceId = parts[0], docId = parts[1];
    var source = SOURCE_BY_ID[sourceId];
    var idx = source.docs.findIndex(function (d) { return d.id === docId; });
    if (idx === -1) { sourceId = "mermaid"; docId = "readme"; idx = 0; key = "mermaid:readme"; }

    if (key !== currentDoc) {
      var panelId = "doc-panel-" + sourceId + "-" + docId;
      // every panel already exists in the DOM (built up front); just flip which one is visible
      document.querySelectorAll(".doc").forEach(function (el) {
        el.classList.toggle("active", el.id === panelId);
      });
      // sidebar highlight (across both navsets; only one doc total is ever "current")
      SOURCES.forEach(function (s) {
        s.docs.forEach(function (d) {
          var g = document.getElementById("navgroup-" + s.id + "-" + d.id);
          var isCurrent = s.id === sourceId && d.id === docId;
          g.classList.toggle("expanded", isCurrent);
          g.querySelector(".navgroup-btn").toggleAttribute("aria-current", isCurrent);
        });
      });
      currentDoc = key;
    }
    if (sourceId !== currentSource) setActiveSource(sourceId);

    closeSidebar();
    requestAnimationFrame(function () {
      if (sectionId) {
        var el = document.getElementById(sectionId);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      } else {
        window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
      }
      updateActiveSub();
    });
    history.replaceState(null, "", "#" + key + (sectionId ? "/" + sectionId : ""));
  }

  function updateActiveSub() {
    document.querySelectorAll(".subnav a").forEach(function (a) { a.classList.remove("active"); });
  }

  // scroll-spy within active doc
  var spyTicking = false;
  window.addEventListener("scroll", function () {
    if (spyTicking) return;
    spyTicking = true;
    requestAnimationFrame(function () {
      spyTicking = false;
      if (!currentDoc) return;
      var panel = document.getElementById("doc-panel-" + currentDoc.replace(":", "-"));
      if (!panel) return;
      var heads = panel.querySelectorAll("h2");
      var activeId = null;
      heads.forEach(function (h) {
        if (h.getBoundingClientRect().top < 140) activeId = h.id;
      });
      document.querySelectorAll(".subnav a").forEach(function (a) {
        a.classList.toggle("active", activeId && a.getAttribute("href") === "#" + activeId);
      });
    });
  });

  // ---- mobile sidebar ----
  var sidebar = document.getElementById("sidebar");
  var scrim = document.getElementById("scrim");
  var menuBtn = document.getElementById("menuBtn");
  function openSidebar() {
    sidebar.classList.add("open");
    scrim.classList.add("show");
    menuBtn.setAttribute("aria-expanded", "true");
  }
  function closeSidebar() {
    sidebar.classList.remove("open");
    scrim.classList.remove("show");
    menuBtn.setAttribute("aria-expanded", "false");
  }
  menuBtn.addEventListener("click", function () {
    sidebar.classList.contains("open") ? closeSidebar() : openSidebar();
  });
  scrim.addEventListener("click", closeSidebar);

  // ---- theme toggle: system -> dark -> light -> system ----
  var root = document.documentElement;
  var themeIcon = document.getElementById("themeIcon");
  var themeLabel = document.getElementById("themeLabel");
  var themeState = "system";
  function applyTheme() {
    if (themeState === "system") { root.removeAttribute("data-theme"); themeIcon.textContent = "◐"; themeLabel.textContent = "Системная тема"; }
    else if (themeState === "dark") { root.setAttribute("data-theme", "dark"); themeIcon.textContent = "●"; themeLabel.textContent = "Тёмная"; }
    else { root.setAttribute("data-theme", "light"); themeIcon.textContent = "○"; themeLabel.textContent = "Светлая"; }
  }
  document.getElementById("themeToggle").addEventListener("click", function () {
    themeState = themeState === "system" ? "dark" : themeState === "dark" ? "light" : "system";
    applyTheme();
  });
  applyTheme();

  // ---- initial route ----
  setActiveSource("mermaid");
  var initial = (location.hash || "").replace(/^#/, "").split("/");
  var startKey = "mermaid:readme";
  if (initial[0] && initial[0].indexOf(":") !== -1) {
    var sp = initial[0].split(":");
    if (SOURCE_BY_ID[sp[0]] && SOURCE_BY_ID[sp[0]].docs.some(function (d) { return d.id === sp[1]; })) {
      startKey = initial[0];
    }
  }
  navigate(startKey, initial[1] || null);
})();
</script>
